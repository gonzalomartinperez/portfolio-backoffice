version: 2

multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: [dependencies]
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
  - package-ecosystem: npm
    directory: /tooling/api-contract
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: [dependencies]
    # openapi-typescript 7.13 requires the classic TypeScript 5 compiler API.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: [dependencies]
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /infra/docker/app
    multi-ecosystem-group: weekly-all
    patterns: ["*"]
    labels: [dependencies]
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7

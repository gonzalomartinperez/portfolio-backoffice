# Release verification (PBO-M1-8 completes it with release-please, build, attest and a gated
# publish). Registry publication stays disabled until MV (DR-13, PBO-D10).
name: Prepare immutable release
on:
  workflow_dispatch:
    inputs:
      publication_authorized:
        description: "Image publication and GHCR package visibility have been explicitly approved"
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: backoffice-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/develop' && inputs.publication_authorized
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

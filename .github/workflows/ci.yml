# CI entry point (ecosystem standard 6.0-6.2; PBO-M1-3). `classify` maps the changed files, branch
# and labels to profiles through .github/ci-profile.json; every job runs only when its profile
# selects it, and `ci-gate` is the single fail-closed required check. Shared jobs come from
# gonzalomartinperez/engineering-standards pinned by commit SHA (release tag in the comment).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    outputs:
      image-sha256:
        description: SHA-256 of the image tarball artifact built in this run (empty when not built).
        value: ${{ jobs.build.outputs.image-sha256 }}
      image-id:
        description: Image configuration digest (docker image ID) of that tarball.
        value: ${{ jobs.build.outputs.image-id }}
permissions: {}
env:
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  AI_PROVIDER: fixture
  EMBEDDINGS_PROVIDER: fixture
  ALLOW_PAID_AI: 'false'
defaults:
  run:
    shell: bash
concurrency:
  # PRs: one run per ref, newer pushes cancel older runs. Other events: one group per commit.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  classify:
    uses: gonzalomartinperez/engineering-standards/.github/workflows/classify.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
      pull-requests: read
  docs:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'docs')
    uses: gonzalomartinperez/engineering-standards/.github/workflows/docs.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
    with:
      # The README follows the ecosystem template from the M6 copy refresh (OD-09).
      readme-check: false
  security:
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'security')
    uses: gonzalomartinperez/engineering-standards/.github/workflows/security.yml@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
    permissions:
      contents: read
      pull-requests: read
    with:
      dependency-review: true
  static:
    name: Static checks
    needs: [classify]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'static')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/api-contract/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated locked contract generator
        run: npm run contract:install
      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate && npm audit --prefix tooling/api-contract --audit-level=moderate
      - name: Run the repository check (same command as the pre-commit hook and AGENTS.md)
        run: npm run check
      - name: Reject generated contract drift
        run: npm run contract:generate && git diff --exit-code contracts/types.d.ts contracts/operations.types.d.ts contracts/product-analytics.types.d.ts contracts/product-analytics-v2.types.d.ts contracts/feedback.types.d.ts
  database:
    name: Database tests
    needs: [classify, static]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'database')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify real PostgreSQL authorization and OAuth boundaries
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: node --test tests/integration/auth.test.ts
  build:
    name: Build image once
    needs: [classify, static]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image-sha256: ${{ steps.digest.outputs.sha256 }}
      image-id: ${{ steps.files.outputs.image-id }}
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile (hadolint, checksum verified)
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            --output /tmp/hadolint
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint' | sha256sum --check
          chmod +x /tmp/hadolint
          /tmp/hadolint --config .hadolint.yaml infra/docker/app/Dockerfile
      - name: Compute the non-secret version stamp
        id: stamp
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image as a tarball (only develop pushes write the cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/app/Dockerfile
          platforms: linux/amd64
          push: false
          tags: portfolio-backoffice:rc
          build-args: |
            APP_VERSION=${{ steps.stamp.outputs.version }}
            APP_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.created }}
          outputs: type=docker,dest=${{ runner.temp }}/backoffice-image.tar
          cache-from: type=gha,scope=backoffice-node24-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'type=gha,mode=max,scope=backoffice-node24-amd64' || '' }}
      - name: Record the image tarball SHA-256
        id: digest
        run: |
          sum=$(sha256sum "$RUNNER_TEMP/backoffice-image.tar" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Image tarball sha256: $sum" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject private files in the image filesystem before upload
        id: files
        run: |
          docker load --input "$RUNNER_TEMP/backoffice-image.tar"
          image_id=$(docker image inspect portfolio-backoffice:rc --format '{{.Id}}')
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "Image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"
          container=$(docker create portfolio-backoffice:rc)
          docker export "$container" | tar -tf - > "$RUNNER_TEMP/image-files.txt"
          docker rm "$container"
          if grep -E '(^|/)(\.env(\..*)?|\.artifacts|\.git|id_rsa|id_ed25519)(/|$)|\.(pem|key|p12)$|fixture-session' "$RUNNER_TEMP/image-files.txt"; then
            echo "Private or credential-like files found in the image filesystem."
            exit 1
          fi
      - name: Verify pinned image scanner
        run: |
          mkdir -p /tmp/image-scanner
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
            --output /tmp/image-scanner/trivy.tar.gz
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/image-scanner/trivy.tar.gz' | sha256sum --check
          tar -xzf /tmp/image-scanner/trivy.tar.gz -C /tmp/image-scanner trivy
      - name: Scan the image filesystem for secrets before upload
        run: |
          /tmp/image-scanner/trivy --config '' image --image-src docker --ignorefile '' \
            --scanners secret --skip-dirs /app/node_modules --exit-code 1 --format table \
            portfolio-backoffice:rc
      - name: Share the image with the runtime jobs (one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backoffice-image
          path: ${{ runner.temp }}/backoffice-image.tar
          retention-days: 1
          if-no-files-found: error
          # A re-run of this job replaces the artifact of its own run; downstream jobs verify the
          # SHA-256 from this job's output, so a stale artifact can never be loaded.
          overwrite: true

  scan:
    name: Image gates and SBOM
    needs: [classify, build]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'scan')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the image built once in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backoffice-image
          path: ${{ runner.temp }}/image
      - name: Load the exact image bytes the build job produced
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image-sha256 }}
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: |
          echo "$IMAGE_SHA256  $RUNNER_TEMP/image/backoffice-image.tar" | sha256sum --check
          docker load --input "$RUNNER_TEMP/image/backoffice-image.tar"
          rm -f "$RUNNER_TEMP/image/backoffice-image.tar"
          test "$(docker image inspect portfolio-backoffice:rc --format '{{.Id}}')" = "$IMAGE_ID"
      - name: Install checksum-verified image tools (dockle, container-structure-test, Grype, Syft)
        run: |
          mkdir -p /tmp/image-tools && cd /tmp/image-tools
          curl --fail --silent --show-error --location --retry 3 --remote-name \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --retry 3 --remote-name \
            https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          curl --fail --silent --show-error --location --retry 3 --remote-name \
            https://github.com/anchore/grype/releases/download/v0.121.3/grype_0.121.3_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 --remote-name \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz
          sha256sum --check <<'SUMS'
          8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad  dockle_0.4.15_Linux-64bit.tar.gz
          fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca  container-structure-test-linux-amd64
          e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85  grype_0.121.3_linux_amd64.tar.gz
          bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  syft_1.57.1_linux_amd64.tar.gz
          SUMS
          tar -xzf dockle_0.4.15_Linux-64bit.tar.gz dockle
          tar -xzf grype_0.121.3_linux_amd64.tar.gz grype
          tar -xzf syft_1.57.1_linux_amd64.tar.gz syft
          mv container-structure-test-linux-amd64 container-structure-test
          chmod +x dockle container-structure-test grype syft
      - name: Check the image structure (user, command, labels, no shell, no secrets files)
        run: /tmp/image-tools/container-structure-test test --driver docker --image portfolio-backoffice:rc --config infra/docker/app/structure-test.yaml
      - name: Check CIS Docker image guidance (dockle, warnings fail)
        run: /tmp/image-tools/dockle --exit-code 1 --exit-level warn portfolio-backoffice:rc
      - name: Reject fixable HIGH or CRITICAL vulnerabilities (Grype)
        run: /tmp/image-tools/grype docker:portfolio-backoffice:rc --only-fixed --fail-on high --output table
      - name: Generate the CycloneDX SBOM (Syft)
        run: /tmp/image-tools/syft docker:portfolio-backoffice:rc --output cyclonedx-json="$RUNNER_TEMP/backoffice-sbom.cdx.json"
      - name: Keep the SBOM with the run (seven days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backoffice-sbom
          path: ${{ runner.temp }}/backoffice-sbom.cdx.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  container:
    name: Container verification
    needs: [classify, build]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'container')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKOFFICE_ORIGIN: http://localhost:3107
      BETTER_AUTH_SECRET: public-fixture-only-at-least-32-characters
      BACKOFFICE_OWNER_EMAIL: owner@example.test
      GOOGLE_CLIENT_ID: public-fixture-client
      GOOGLE_CLIENT_SECRET: public-fixture-secret
      GITHUB_CLIENT_ID: public-fixture-client
      GITHUB_CLIENT_SECRET: public-fixture-secret
      CI_JOB_ID: container
      CI_POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: backoffice_fixture
          POSTGRES_PASSWORD: public-fixture-only
          POSTGRES_DB: backoffice_test
        options: >-
          --health-cmd "pg_isready -U backoffice_fixture -d backoffice_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No package cache in jobs that build the runtime image (cache-poisoning hardening).
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Expose this job's PostgreSQL service network
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
        run: echo "CI_POSTGRES_NETWORK=$SERVICE_NETWORK" >> "$GITHUB_ENV"
      - name: Download the image built once in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backoffice-image
          path: ${{ runner.temp }}/image
      - name: Load the exact image bytes the build job produced
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image-sha256 }}
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: |
          echo "$IMAGE_SHA256  $RUNNER_TEMP/image/backoffice-image.tar" | sha256sum --check
          docker load --input "$RUNNER_TEMP/image/backoffice-image.tar"
          rm -f "$RUNNER_TEMP/image/backoffice-image.tar"
          test "$(docker image inspect portfolio-backoffice:rc --format '{{.Id}}')" = "$IMAGE_ID"
      - name: Write synthetic container configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKOFFICE_ORIGIN', 'BETTER_AUTH_SECRET', 'BACKOFFICE_OWNER_EMAIL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET'];
          const values = names.map(name => `${name}=${process.env[name]}`);
          values.push('OPERATIONS_API_ORIGIN=http://host.docker.internal:8117');
          values.push('OPERATIONS_READ_TOKEN=public-loopback-operations-fixture');
          values.push('OPERATIONS_SOURCE_MODE=fixture');
          values.push('PRODUCT_ANALYTICS_ENABLED=true');
          values.push('FEEDBACK_OVERVIEW_ENABLED=true');
          values.push(`BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@${process.env.CI_POSTGRES_HOST}:5432/backoffice_test`);
          writeFileSync('/tmp/backoffice-fixture.env', values.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Migrate the isolated authentication database
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio-backoffice:rc node scripts/auth-migrate.ts
      - name: Start the exact image with isolated fixture configuration
        run: |
          docker run -d --name assistant-browser --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --tmpfs /app/.next/cache:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --stop-timeout=20 --log-driver=local --log-opt max-size=10m --log-opt max-file=3 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3108:3000 portfolio-backoffice:rc
      - name: Verify bounded resources, readiness, isolation and anonymous workload
        run: node scripts/verify-container.ts measure assistant-browser http://127.0.0.1:3108
      - name: Measure bounded idle SIGTERM termination
        run: node scripts/verify-container.ts shutdown assistant-browser
      - name: Remove only this job's container
        if: always()
        run: |
          docker rm -f assistant-browser
          rm -f /tmp/backoffice-fixture.env
  browser:
    name: Browser tests
    needs: [classify, build]
    if: contains(fromJSON(needs.classify.outputs.jobs), 'browser')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKOFFICE_ORIGIN: http://localhost:3107
      BETTER_AUTH_SECRET: public-fixture-only-at-least-32-characters
      BACKOFFICE_OWNER_EMAIL: owner@example.test
      GOOGLE_CLIENT_ID: public-fixture-client
      GOOGLE_CLIENT_SECRET: public-fixture-secret
      GITHUB_CLIENT_ID: public-fixture-client
      GITHUB_CLIENT_SECRET: public-fixture-secret
      CI_JOB_ID: browser
      CI_POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:18.7-trixie@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: backoffice_fixture
          POSTGRES_PASSWORD: public-fixture-only
          POSTGRES_DB: backoffice_test
        ports:
          - '5432'
        options: >-
          --health-cmd "pg_isready -U backoffice_fixture -d backoffice_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No package cache in jobs that build the runtime image (cache-poisoning hardening).
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Expose this job's PostgreSQL service network
        env:
          SERVICE_NETWORK: ${{ job.services.postgres.network }}
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          echo "CI_POSTGRES_NETWORK=$SERVICE_NETWORK" >> "$GITHUB_ENV"
          echo "BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@127.0.0.1:$SERVICE_PORT/backoffice_test" >> "$GITHUB_ENV"
      - name: Download the image built once in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backoffice-image
          path: ${{ runner.temp }}/image
      - name: Load the exact image bytes the build job produced
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image-sha256 }}
          IMAGE_ID: ${{ needs.build.outputs.image-id }}
        run: |
          echo "$IMAGE_SHA256  $RUNNER_TEMP/image/backoffice-image.tar" | sha256sum --check
          docker load --input "$RUNNER_TEMP/image/backoffice-image.tar"
          rm -f "$RUNNER_TEMP/image/backoffice-image.tar"
          test "$(docker image inspect portfolio-backoffice:rc --format '{{.Id}}')" = "$IMAGE_ID"
      - name: Write synthetic container configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKOFFICE_ORIGIN', 'BETTER_AUTH_SECRET', 'BACKOFFICE_OWNER_EMAIL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET'];
          const values = names.map(name => `${name}=${process.env[name]}`);
          values.push('OPERATIONS_API_ORIGIN=http://host.docker.internal:8117');
          values.push('OPERATIONS_READ_TOKEN=public-loopback-operations-fixture');
          values.push('OPERATIONS_SOURCE_MODE=fixture');
          values.push('PRODUCT_ANALYTICS_ENABLED=true');
          values.push('FEEDBACK_OVERVIEW_ENABLED=true');
          values.push(`BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@${process.env.CI_POSTGRES_HOST}:5432/backoffice_test`);
          writeFileSync('/tmp/backoffice-fixture.env', values.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Migrate the isolated authentication database
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio-backoffice:rc node scripts/auth-migrate.ts
      - name: Prepare all reviewed browser engines
        run: npx --no-install playwright install --with-deps --only-shell chromium firefox webkit
      - name: Start the exact image with isolated fixture configuration
        run: |
          docker run -d --name assistant-browser --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --tmpfs /app/.next/cache:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --stop-timeout=20 --log-driver=local --log-opt max-size=10m --log-opt max-file=3 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3108:3000 portfolio-backoffice:rc
      - name: Verify real-database authorization, operations and accessibility
        run: npm run test:browser -- backoffice.spec.ts --grep-invert "operational failure" --output test-results/available
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/available
      - name: Verify operational failure without shared mutable fixtures
        run: npm run test:browser -- backoffice.spec.ts --grep "operational failure" --output test-results/unavailable
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
          OPERATIONS_FIXTURE_MODE: unavailable
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/unavailable
      - name: Retain synthetic UI screenshots (never session files or traces)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backoffice-ui-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Remove only this job's container
        if: always()
        run: |
          docker rm -f assistant-browser
          rm -f /tmp/backoffice-fixture.env
  node-next:
    # Two-week dual-version window before the Node 26 flip (E10, OD-77): informational, so it is
    # deliberately not in ci-gate.needs. Its result is read in the M1 exit review.
    name: Node 26 (informational)
    needs: classify
    if: contains(fromJSON(needs.classify.outputs.jobs), 'static')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Install locked dependencies (engines allow Node 24 only until the flip)
        run: npm ci --no-audit --no-fund --engine-strict=false
      - name: Type-check, unit and contract tests on Node 26
        run: npm run typecheck && npm test
      - name: Production build on Node 26
        run: npm run build

  ci-gate:
    name: ci-gate
    if: always()
    needs: [classify, docs, security, static, database, build, scan, container, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: gonzalomartinperez/engineering-standards/actions/ci-gate@1f33be46bcb95f42f550f74608bc679cae5575ad # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          expected: ${{ needs.classify.outputs.jobs }}
  required-checks:
    # Transitional alias: branch protection still requires the "Required checks" context. It
    # mirrors ci-gate, so the owner can switch the required check to `ci-gate` (PBO-M1-11) with
    # both contexts present, then delete this job. Not listed in ci-gate.needs on purpose.
    name: Required checks
    if: always()
    needs: [ci-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require a successful ci-gate
        env:
          GATE_RESULT: ${{ needs.ci-gate.result }}
        run: test "$GATE_RESULT" = success

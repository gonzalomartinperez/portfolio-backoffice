name: Quality
'on':
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - develop
      - main
  merge_group: null
  workflow_dispatch: null
  workflow_call: null
  push:
    branches:
      - develop
      - main
permissions:
  contents: read
env:
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
  CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
  AI_PROVIDER: fixture
  EMBEDDINGS_PROVIDER: fixture
  ALLOW_PAID_AI: 'false'
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate paired profile, events and security policy
        run: node scripts/check-ci-profile.ts
      - name: Run checksum-verified official actionlint
        run: node scripts/check-workflows.ts
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked scanner dependencies
        run: npm ci --no-audit --no-fund
      - name: Scan candidate and reachable history with redacted output
        run: npm run security:check
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/api-contract/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated locked contract generator
        run: npm run contract:install
      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate && npm audit --prefix tooling/api-contract --audit-level=moderate
      - name: Check formatting, lint and strict types
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Enforce architecture and test authorization, operations and contracts
        run: npm test
      - name: Validate documentation, licenses and repository skills
        run: npm run docs:check && npm run license:check && npm run skills:check
      - name: Verify dependency protection access or mandatory disabled state
        run: node scripts/dependency-automation.ts
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_INSPECT: 'true'
          DEPENDABOT_AUTOMERGE: ${{ vars.DEPENDABOT_AUTOMERGE }}
          DEPENDABOT_POLICY_READY: ${{ vars.DEPENDABOT_POLICY_READY }}
      - name: Reject generated contract drift
        run: npm run contract:generate && git diff --exit-code contracts/types.d.ts contracts/operations.types.d.ts contracts/product-analytics.types.d.ts contracts/product-analytics-v2.types.d.ts contracts/feedback.types.d.ts
    name: Static checks
  database:
    name: Database tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKOFFICE_ORIGIN: http://localhost:3107
      BETTER_AUTH_SECRET: public-fixture-only-at-least-32-characters
      BACKOFFICE_OWNER_EMAIL: owner@example.test
      GOOGLE_CLIENT_ID: public-fixture-client
      GOOGLE_CLIENT_SECRET: public-fixture-secret
      GITHUB_CLIENT_ID: public-fixture-client
      GITHUB_CLIENT_SECRET: public-fixture-secret
      CI_JOB_ID: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read the canonical PostgreSQL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gonzalomartinperez/portfolio-assistant-api
          ref: e6b2e67c1a0ebded3d03209594e0cfce1b1720e5
          path: .artifacts/api-compatibility
          persist-credentials: false
      - name: Verify the canonical PostgreSQL source
        run: node scripts/ci-postgres.ts source
      - name: Build the canonical PostgreSQL artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .artifacts/api-compatibility
          file: .artifacts/api-compatibility/infra/docker/postgres/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice-postgres:rc
          cache-from: type=gha,scope=canonical-postgres18-amd64
          cache-to: type=gha,mode=max,scope=canonical-postgres18-amd64
      - name: Start this job's canonical PostgreSQL fixture
        run: node scripts/ci-postgres.ts start
      - name: Bind build start to this candidate
        run: node scripts/ci-build-provenance.ts start
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice:rc
          cache-from: type=gha,scope=backoffice-node24-amd64
      - name: Verify and record private source-bound image provenance
        run: node scripts/ci-build-provenance.ts record
      - name: Verify the project-owned PostgreSQL18.6 IAM artifact
        run: |
          node scripts/verify-postgres.ts portfolio-backoffice:rc portfolio-backoffice-postgres:rc
      - name: Verify pinned PostgreSQL image scanner
        run: |
          mkdir -p /tmp/image-scanner
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
            --output /tmp/image-scanner/trivy.tar.gz
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/image-scanner/trivy.tar.gz' | sha256sum --check
          tar -xzf /tmp/image-scanner/trivy.tar.gz -C /tmp/image-scanner trivy
      - name: Inventory the exact PostgreSQL image
        run: |
          umask 077
          if ! /tmp/image-scanner/trivy --config '' image --image-src docker \
            --ignorefile '' --scanners vuln --list-all-pkgs --format json \
            --output /tmp/postgres-image-vulnerabilities.json portfolio-backoffice-postgres:rc \
            > /tmp/postgres-image-scan.log 2>&1; then
            echo 'PostgreSQL image inventory failed; raw diagnostics remain ephemeral.'
            exit 1
          fi
      - name: Gate PostgreSQL critical and fixable high findings
        run: |
          postgres_image_id=$(docker image inspect portfolio-backoffice-postgres:rc --format '{{.Id}}')
          node scripts/postgres-image-security.ts /tmp/postgres-image-vulnerabilities.json "$postgres_image_id"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: |
            .artifacts/api-compatibility/uv.lock
            .artifacts/api-compatibility/.python-version
      - name: Verify restricted IAM with both real applications and this exact image
        working-directory: .artifacts/api-compatibility
        run: |
          uv sync --frozen
          docker tag portfolio-backoffice-postgres:rc portfolio-assistant-postgres:project-ci
          uv run python -m scripts.verify_project_databases --authorize-fixture \
            --postgres-image portfolio-assistant-postgres:project-ci \
            --backoffice-path "$GITHUB_WORKSPACE" \
            --backoffice-image portfolio-backoffice:rc \
            --output "$GITHUB_WORKSPACE/.artifacts/project-databases.json"
      - name: Write synthetic container configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKOFFICE_ORIGIN', 'BETTER_AUTH_SECRET', 'BACKOFFICE_OWNER_EMAIL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET'];
          const values = names.map(name => `${name}=${process.env[name]}`);
          values.push('OPERATIONS_API_ORIGIN=http://host.docker.internal:8117');
          values.push('OPERATIONS_READ_TOKEN=public-loopback-operations-fixture');
          values.push('OPERATIONS_SOURCE_MODE=fixture');
          values.push('PRODUCT_ANALYTICS_ENABLED=true');
          values.push('FEEDBACK_OVERVIEW_ENABLED=true');
          values.push(`BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@${process.env.CI_POSTGRES_HOST}:5432/backoffice_test`);
          writeFileSync('/tmp/backoffice-fixture.env', values.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Migrate the isolated authentication database
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio-backoffice:rc node scripts/auth-migrate.ts
      - name: Verify real PostgreSQL authorization and OAuth boundaries
        run: node --test tests/integration/auth.test.ts
      - name: Retain safe synthetic database recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-database-verification
          path: .artifacts/project-databases.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove only synthetic database configuration
        if: always()
        run: rm -f /tmp/backoffice-fixture.env
      - name: Remove only this job's canonical PostgreSQL fixture
        if: always()
        run: node scripts/ci-postgres.ts cleanup
  container:
    name: Container verification
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKOFFICE_ORIGIN: http://localhost:3107
      BETTER_AUTH_SECRET: public-fixture-only-at-least-32-characters
      BACKOFFICE_OWNER_EMAIL: owner@example.test
      GOOGLE_CLIENT_ID: public-fixture-client
      GOOGLE_CLIENT_SECRET: public-fixture-secret
      GITHUB_CLIENT_ID: public-fixture-client
      GITHUB_CLIENT_SECRET: public-fixture-secret
      CI_JOB_ID: container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read the canonical PostgreSQL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gonzalomartinperez/portfolio-assistant-api
          ref: e6b2e67c1a0ebded3d03209594e0cfce1b1720e5
          path: .artifacts/api-compatibility
          persist-credentials: false
      - name: Verify the canonical PostgreSQL source
        run: node scripts/ci-postgres.ts source
      - name: Build the canonical PostgreSQL artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .artifacts/api-compatibility
          file: .artifacts/api-compatibility/infra/docker/postgres/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice-postgres:rc
          cache-from: type=gha,scope=canonical-postgres18-amd64
      - name: Start this job's canonical PostgreSQL fixture
        run: node scripts/ci-postgres.ts start
      - name: Bind build start to this candidate
        run: node scripts/ci-build-provenance.ts start
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice:rc
          cache-from: type=gha,scope=backoffice-node24-amd64
          cache-to: type=gha,mode=max,scope=backoffice-node24-amd64
      - name: Verify and record private source-bound image provenance
        run: node scripts/ci-build-provenance.ts record
      - name: Verify pinned image scanner
        run: |
          mkdir -p /tmp/image-scanner
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz \
            --output /tmp/image-scanner/trivy.tar.gz
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/image-scanner/trivy.tar.gz' | sha256sum --check
          tar -xzf /tmp/image-scanner/trivy.tar.gz -C /tmp/image-scanner trivy
      - name: Scan the complete runtime and reject high or critical vulnerabilities
        run: |
          /tmp/image-scanner/trivy --config '' image --image-src docker \
            --ignorefile '' --scanners vuln --format json --output /tmp/image-vulnerabilities.json \
            portfolio-backoffice:rc
          /tmp/image-scanner/trivy --config '' convert --ignorefile '' --scanners vuln \
            --exit-code 1 --severity HIGH,CRITICAL --table-mode detailed /tmp/image-vulnerabilities.json
      - name: Write synthetic container configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKOFFICE_ORIGIN', 'BETTER_AUTH_SECRET', 'BACKOFFICE_OWNER_EMAIL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET'];
          const values = names.map(name => `${name}=${process.env[name]}`);
          values.push('OPERATIONS_API_ORIGIN=http://host.docker.internal:8117');
          values.push('OPERATIONS_READ_TOKEN=public-loopback-operations-fixture');
          values.push('OPERATIONS_SOURCE_MODE=fixture');
          values.push('PRODUCT_ANALYTICS_ENABLED=true');
          values.push('FEEDBACK_OVERVIEW_ENABLED=true');
          values.push(`BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@${process.env.CI_POSTGRES_HOST}:5432/backoffice_test`);
          writeFileSync('/tmp/backoffice-fixture.env', values.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Migrate the isolated authentication database
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio-backoffice:rc node scripts/auth-migrate.ts
      - name: Start the exact image with isolated fixture configuration
        run: |
          docker run -d --name assistant-browser --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --tmpfs /app/.next/cache:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --stop-timeout=20 --log-driver=local --log-opt max-size=10m --log-opt max-file=3 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3108:3000 portfolio-backoffice:rc
      - name: Verify bounded resources, readiness, isolation and anonymous workload
        run: node scripts/verify-container.ts measure assistant-browser http://127.0.0.1:3108
      - name: Measure bounded idle SIGTERM termination
        run: node scripts/verify-container.ts shutdown assistant-browser
      - name: Remove only this job's container
        if: always()
        run: |
          docker rm -f assistant-browser
          rm -f /tmp/backoffice-fixture.env
      - name: Remove only this job's canonical PostgreSQL fixture
        if: always()
        run: node scripts/ci-postgres.ts cleanup
  browser:
    name: Browser tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKOFFICE_ORIGIN: http://localhost:3107
      BETTER_AUTH_SECRET: public-fixture-only-at-least-32-characters
      BACKOFFICE_OWNER_EMAIL: owner@example.test
      GOOGLE_CLIENT_ID: public-fixture-client
      GOOGLE_CLIENT_SECRET: public-fixture-secret
      GITHUB_CLIENT_ID: public-fixture-client
      GITHUB_CLIENT_SECRET: public-fixture-secret
      CI_JOB_ID: browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read the canonical PostgreSQL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gonzalomartinperez/portfolio-assistant-api
          ref: e6b2e67c1a0ebded3d03209594e0cfce1b1720e5
          path: .artifacts/api-compatibility
          persist-credentials: false
      - name: Verify the canonical PostgreSQL source
        run: node scripts/ci-postgres.ts source
      - name: Build the canonical PostgreSQL artifact
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .artifacts/api-compatibility
          file: .artifacts/api-compatibility/infra/docker/postgres/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice-postgres:rc
          cache-from: type=gha,scope=canonical-postgres18-amd64
      - name: Start this job's canonical PostgreSQL fixture
        run: node scripts/ci-postgres.ts start
      - name: Bind build start to this candidate
        run: node scripts/ci-build-provenance.ts start
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: portfolio-backoffice:rc
          cache-from: type=gha,scope=backoffice-node24-amd64
      - name: Verify and record private source-bound image provenance
        run: node scripts/ci-build-provenance.ts record
      - name: Write synthetic container configuration
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKOFFICE_ORIGIN', 'BETTER_AUTH_SECRET', 'BACKOFFICE_OWNER_EMAIL',
            'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET'];
          const values = names.map(name => `${name}=${process.env[name]}`);
          values.push('OPERATIONS_API_ORIGIN=http://host.docker.internal:8117');
          values.push('OPERATIONS_READ_TOKEN=public-loopback-operations-fixture');
          values.push('OPERATIONS_SOURCE_MODE=fixture');
          values.push('PRODUCT_ANALYTICS_ENABLED=true');
          values.push('FEEDBACK_OVERVIEW_ENABLED=true');
          values.push(`BACKOFFICE_DATABASE_URL=postgres://backoffice_fixture:public-fixture-only@${process.env.CI_POSTGRES_HOST}:5432/backoffice_test`);
          writeFileSync('/tmp/backoffice-fixture.env', values.join('\n') + '\n', { mode: 0o600 });
          NODE
      - name: Migrate the isolated authentication database
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --cap-drop ALL --security-opt no-new-privileges \
            portfolio-backoffice:rc node scripts/auth-migrate.ts
      - name: Prepare all reviewed browser engines
        run: npx --no-install playwright install --with-deps --only-shell chromium firefox webkit
      - name: Start the exact image with isolated fixture configuration
        run: |
          docker run -d --name assistant-browser --network "$CI_POSTGRES_NETWORK" --add-host host.docker.internal:host-gateway \
            --env-file /tmp/backoffice-fixture.env \
            --read-only --tmpfs /tmp:uid=65532,gid=65532,mode=0700,size=32m \
            --tmpfs /app/.next/cache:uid=65532,gid=65532,mode=0700,size=32m \
            --memory=512m --memory-swap=512m --cpus=0.75 --pids-limit=128 \
            --stop-timeout=20 --log-driver=local --log-opt max-size=10m --log-opt max-file=3 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3108:3000 portfolio-backoffice:rc
      - name: Verify real-database authorization, operations and accessibility
        run: npm run test:browser -- backoffice.spec.ts --grep-invert "operational failure" --output test-results/available
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/available
      - name: Verify operational failure without shared mutable fixtures
        run: npm run test:browser -- backoffice.spec.ts --grep "operational failure" --output test-results/unavailable
        env:
          WEB_UPSTREAM: http://127.0.0.1:3108
          OPERATIONS_FIXTURE_MODE: unavailable
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/unavailable
      - name: Retain synthetic UI screenshots (never session files or traces)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backoffice-ui-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove only this job's container
        if: always()
        run: |
          docker rm -f assistant-browser
          rm -f /tmp/backoffice-fixture.env
      - name: Remove only this job's canonical PostgreSQL fixture
        if: always()
        run: node scripts/ci-postgres.ts cleanup
  checks:
    if: always()
    needs:
      - workflows
      - secrets
      - static
      - database
      - container
      - browser
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every validation job
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-results.ts
    name: Required checks
